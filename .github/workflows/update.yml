name: Actualizar Resultados Triplex
on:
schedule:
# Se ejecuta cada hora en punto
- cron: '0 * * * *'
workflow_dispatch:
jobs:
update-data:
runs-on: ubuntu-latest
steps:
- name: Checkout repositorio
uses: actions/checkout@v4
- name: Configurar Node.js
uses: actions/setup-node@v4
with:
node-version: '20'
- name: Ejecutar script de extracción
run: node update-results.js
- name: Commit y Push de los cambios si los hay
run: |
git config --global user.name "GitHub Actions Bot"
git config --global user.email "actions@github.com"
git add data/
git diff --quiet && git diff --staged --quiet || (git commit -m "Actualización automática de resultados [skip ci]" && git push)
